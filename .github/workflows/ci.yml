name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  firestore-emulator:
    runs-on: ubuntu-latest
    env:
      REQUIRE_FIRESTORE_EMULATOR: "1"
      FIREBASE_ANALYTICS_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Run the contract suites on the Firestore emulator
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-contract "npx vitest run src/adapters/firestore.test.ts"
